[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "whowouldwin-sim"
version = "0.1.0"
description = "Deterministic combat simulation, statistics, debug replay and cinematic shot pipelines"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "pygame-ce>=2.5,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "runwayml>=5.20,<6"]
video = ["imageio-ffmpeg>=0.6,<1", "Pillow>=11,<13", "numpy>=2,<3"]

runway = ["runwayml>=5.20,<6"]

[project.scripts]
whowouldwin = "whowouldwin.cli.main:main"
wws = "whowouldwin.cli.main:main"
whowouldwin-view = "whowouldwin.visual.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whowouldwin = ["data/characters/*.json", "data/matchups/*.yaml", "data/presentation/*.json", "data/visual_bibles/*.json", "data/arena_visuals/*.json", "data/ability_visuals/*.json", "data/golden_visual_bibles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: thousand-fight integration checks"]
